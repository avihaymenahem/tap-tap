apply plugin: 'com.android.application'

// Release signing is driven by a gitignored `keystore.properties` (see
// RELEASE.md for how to generate the keystore). When it is absent — a fresh
// clone, CI, or a plain debug build — the release signingConfig is left unset
// and `assembleDebug` still works with no setup.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.taptap.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.taptap.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "0.15.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // youtubedl-android ships Python + ffmpeg per ABI, which dominates the
        // APK size. Ship only arm64-v8a — the physical device (S25) — which
        // roughly halves the download again. Add 'x86_64' back here if you need
        // to run the bundled build in an emulator.
        ndk {
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // minify stays OFF on purpose: youtubedl-android reaches its Python
            // runtime and ffmpeg through JNI/reflection, which R8 would strip and
            // break ingest — and it can't be verified without the physical device.
            // The size win comes from arm64-only above, not from shrinking code.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign with the release key when the keystore is present; without it,
            // only `assembleDebug` (auto-signed with the debug key) can install.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    packagingOptions {
        jniLibs {
            // youtubedl-android ships its Python runtime as libpython.zip.so and
            // opens it as a real file at init; modern AGP keeps native libs
            // compressed inside the APK, so it must be extracted to disk or init
            // fails with FileNotFoundException. This is the flag that does it.
            useLegacyPackaging = true
            // The library and ffmpeg artifacts both carry libc++_shared.so.
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // On-device ingest (PLAN.md §6h, MC1): the yt-dlp replacement. Bundles yt-dlp
    // + a Python runtime + ffmpeg into the APK — the same yt-dlp the desktop
    // pipeline shelled out to, so metadata/download/transcode behaviour matches.
    def youtubedlAndroid = "0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroid"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:$youtubedlAndroid"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
